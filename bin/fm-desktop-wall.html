<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>desktop wall</title>
<style>
  :root {
    --bg: #0f1113; --panel: #171a1d; --line: #262b30; --text: #e6e8ea;
    --dim: #8b949e; --ok: #3fb950; --warn: #d29922; --dead: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel);
           border-bottom: 1px solid var(--line); padding: 10px 14px;
           display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; letter-spacing: .2px; }
  input, select, button { background: #0f1113; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: inherit; }
  input:focus, select:focus { outline: 1px solid #3b82f6; }
  button { cursor: pointer; }
  button[aria-pressed="true"] { background: #1f6feb; border-color: #1f6feb; }
  .spacer { flex: 1 1 auto; }
  .meta { color: var(--dim); font-size: 12px; }
  main { padding: 12px 14px 40px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 18px 0 8px; font-weight: 600; }
  .grid { display: grid; gap: 12px;
          grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          overflow: hidden; min-width: 0; display: flex; flex-direction: column; }
  .shot { position: relative; aspect-ratio: 16 / 9; background: #000; display: block; }
  .shot img, .shot iframe { width: 100%; height: 100%; border: 0; display: block;
                            object-fit: cover; }
  .shot .empty { position: absolute; inset: 0; display: grid; place-items: center;
                 color: var(--dim); font-size: 12px; text-align: center; padding: 8px; }
  .bar { display: flex; gap: 8px; align-items: baseline; padding: 8px 10px;
         border-top: 1px solid var(--line); min-width: 0; }
  .name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis;
          white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
         background: var(--dim); align-self: center; }
  .dot.live { background: var(--ok); } .dot.idle { background: var(--warn); }
  .dot.down { background: var(--dead); }
  .status { color: var(--dim); font-size: 12px; padding: 0 10px 9px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .golive { margin-left: auto; flex: 0 0 auto; font-size: 12px; padding: 3px 7px; }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: center;
           margin: 22px 0 0; color: var(--dim); }
  @media (max-width: 700px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    h1 { width: 100%; }
    /* Give the name its own line rather than truncating it to "tetan…". */
    .bar { flex-wrap: wrap; }
    .name { flex: 1 1 100%; }
    .golive { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>desktop wall</h1>
  <input id="q" type="search" placeholder="search name, owner, project" size="22">
  <select id="filter">
    <option value="all">all</option>
    <option value="up">running</option>
    <option value="active">active</option>
    <option value="down">stopped</option>
  </select>
  <select id="interval" title="snapshot interval">
    <option value="2">2s</option>
    <option value="5" selected>5s</option>
    <option value="10">10s</option>
    <option value="30">30s</option>
  </select>
  <button id="live" aria-pressed="false" title="switch visible tiles to live RFB">live</button>
  <span class="spacer"></span>
  <span class="meta" id="summary">loading…</span>
</header>
<main>
  <div id="groups"></div>
  <div class="pager">
    <button id="prev">prev</button>
    <span id="pageinfo"></span>
    <button id="next">next</button>
    <select id="pagesize" title="tiles per page">
      <option>6</option><option selected>12</option><option>24</option><option>48</option>
    </select>
  </div>
</main>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const el = (id) => document.getElementById(id);
const state = { tiles: [], visible: new Set(), live: false, page: 0, timer: null };

el("q").value = params.get("q") || "";
if (params.get("filter")) el("filter").value = params.get("filter");
if (params.get("interval")) el("interval").value = params.get("interval");
if (params.get("pagesize")) el("pagesize").value = params.get("pagesize");

function interval() { return Number(el("interval").value) || 5; }
function pageSize() { return Number(el("pagesize").value) || 12; }

function matches(t) {
  const q = el("q").value.trim().toLowerCase();
  if (q && ![t.name, t.label, t.owner, t.project, t.group, t.status]
            .join(" ").toLowerCase().includes(q)) return false;
  const f = el("filter").value;
  if (f === "up") return t.up;
  if (f === "down") return !t.up;
  if (f === "active") return t.up && t.changed_ago !== null && t.changed_ago < 60;
  return true;
}

function activity(t) {
  if (!t.up) return ["down", "stopped"];
  if (t.changed_ago === null) return ["idle", "no snapshot yet"];
  if (t.changed_ago < 30) return ["live", "active " + Math.round(t.changed_ago) + "s ago"];
  return ["idle", "idle " + Math.round(t.changed_ago / 60) + " min"];
}

// One IntersectionObserver drives the whole cost model: a tile nobody can see is
// never reported as visible, so the server never captures it.
const seen = new IntersectionObserver((entries) => {
  for (const e of entries) {
    const name = e.target.dataset.name;
    if (e.isIntersecting) state.visible.add(name); else state.visible.delete(name);
  }
}, { rootMargin: "100px" });

function liveUrl(name, viewOnly) {
  return "/vnc.html?path=" + encodeURIComponent("websockify?token=" + name) +
         "&autoconnect=true&resize=scale" + (viewOnly ? "&view_only=true" : "");
}

function tileNode(t) {
  const node = document.createElement("div");
  node.className = "tile";
  node.dataset.name = t.name;
  const [cls, when] = activity(t);
  node.innerHTML =
    '<a class="shot" href="' + liveUrl(t.name, false) + '" target="_blank" rel="noopener"></a>' +
    '<div class="bar"><span class="dot ' + cls + '"></span>' +
    '<span class="name"></span><span class="meta">:' + t.display + "</span>" +
    '<button class="golive" title="live view in this tile">live</button></div>' +
    '<div class="status"></div>';
  node.querySelector(".name").textContent = t.label;
  node.querySelector(".status").textContent = t.status || when;
  node.querySelector(".status").title = t.error || t.status || "";
  node.querySelector(".golive").onclick = (ev) => {
    ev.preventDefault();
    node.dataset.live = node.dataset.live === "1" ? "" : "1";
    paintShot(node, t);
  };
  seen.observe(node);
  return node;
}

function paintShot(node, t) {
  const shot = node.querySelector(".shot");
  const goLive = state.live || node.dataset.live === "1";
  if (goLive) {
    if (!shot.querySelector("iframe")) {
      shot.innerHTML = '<iframe src="' + liveUrl(t.name, true) + '" loading="lazy"></iframe>';
    }
    return;
  }
  if (t.captured_ago === null) {
    shot.innerHTML = '<div class="empty">' +
      (t.up ? "waiting for first snapshot…" : "display stopped") + "</div>";
    return;
  }
  const stamp = Math.round(t.server_stamp - t.captured_ago);
  let img = shot.querySelector("img");
  if (!img) { shot.innerHTML = ""; img = document.createElement("img"); shot.appendChild(img); }
  const src = "/wall/snap/" + t.name + ".webp?t=" + stamp;
  if (img.getAttribute("src") !== src) img.setAttribute("src", src);
}

function render() {
  const wanted = state.tiles.filter(matches);
  const pages = Math.max(1, Math.ceil(wanted.length / pageSize()));
  state.page = Math.min(state.page, pages - 1);
  const slice = wanted.slice(state.page * pageSize(), (state.page + 1) * pageSize());

  const groups = new Map();
  for (const t of slice) {
    if (!groups.has(t.group)) groups.set(t.group, []);
    groups.get(t.group).push(t);
  }
  const root = el("groups");
  root.textContent = "";
  for (const [group, tiles] of [...groups.entries()].sort()) {
    const h = document.createElement("h2");
    h.textContent = group + " · " + tiles.length;
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const t of tiles) {
      const node = tileNode(t);
      grid.appendChild(node);
      paintShot(node, t);
    }
    root.append(h, grid);
  }
  // The first tick runs before any tile exists, so nothing is visible yet and
  // nothing is captured. Kick one more as soon as tiles are on screen.
  if (!state.kicked) { state.kicked = true; setTimeout(tick, 250); }
  el("pageinfo").textContent = "page " + (state.page + 1) + " / " + pages +
    " · " + wanted.length + " of " + state.tiles.length + " desktops";
  el("prev").disabled = state.page === 0;
  el("next").disabled = state.page >= pages - 1;
}

async function tick() {
  try {
    const view = await fetch("/wall/api/view", {
      method: "POST",
      body: JSON.stringify({ visible: [...state.visible], interval: interval() }),
    }).then(r => r.json());
    const data = await fetch("/wall/api/state", { cache: "no-store" }).then(r => r.json());
    state.tiles = data.tiles.map(t => ({ ...t, server_stamp: data.server_time }));
    const capturing = state.tiles.filter(t => state.visible.has(t.name) && t.up).length;
    el("summary").textContent = state.tiles.length + " desktops · " + capturing +
      " capturing · every " + view.interval + "s (floor " + view.min_interval + "s)";
    render();
  } catch (err) {
    el("summary").textContent = "wall server unreachable: " + err;
  }
}

function restart() {
  clearInterval(state.timer);
  state.timer = setInterval(tick, interval() * 1000);
  tick();
}

el("q").oninput = () => { state.page = 0; render(); };
el("filter").onchange = () => { state.page = 0; render(); };
el("interval").onchange = restart;
el("pagesize").onchange = () => { state.page = 0; render(); };
el("prev").onclick = () => { state.page--; render(); };
el("next").onclick = () => { state.page++; render(); };
el("live").onclick = () => {
  state.live = !state.live;
  el("live").setAttribute("aria-pressed", String(state.live));
  render();
};
restart();
</script>
</body>
</html>
