# Per-repo no-mistakes overrides.

# firstmate is an agent-orchestration repo: its AGENTS.md installs a fleet-captain
# identity. Disable project-level agent settings/instructions for gate agents so a
# no-mistakes review/fix/document/test/lint/pr/rebase/ci agent never adopts that
# identity or drives the fleet. Trusted-only: a pushed branch cannot turn this off,
# so it is honored only from the default-branch copy of this file. Layered above
# the NO_MISTAKES_GATE lifecycle refusal (bin/fm-gate-refuse-lib.sh) and the
# HEAD-continuity guard; see docs/architecture.md "No-mistakes gate authority boundary."
disable_project_settings: true

# Trusted documentation placement policy for the Document step.
# The audience inventory and coding guideline own the detail; keep this as a
# pointer so gate instructions cannot become a second prose policy.
document:
  instructions: |
    Read docs/documentation-audiences.md and its machine-consumed
    docs/documentation-audiences.json inventory before changing documentation.
    Apply the knowledge-placement policy in
    .agents/skills/firstmate-coding-guidelines/SKILL.md.
    For changed prose, verify audience, authoritative owner, current relevance,
    evidence destination, and unique safety facts, then review the complete
    branch diff again after every documentation or lint fix.

# Pin lint to the same owner CI runs instead of leaving it to no-mistakes'
# default handling, which does not invoke the repository's canonical lint gate.
# `bin/fm-lint.sh` owns the complete lint definition and
# `.github/workflows/ci.yml` invokes it directly, with parity asserted by
# `tests/fm-lint.test.sh`.
#
# Pin test to a deterministic, non-agent command whose scope follows the change.
# Two contracts meet here and both are kept:
#   - WHO runs the step: never an agent. An agent-driven Test step has crashed
#     the daemon, so this repository pins a concrete command instead of leaving
#     Test to default agent-driven handling.
#   - HOW MUCH it runs: only what the change maps to. Local no-mistakes Test is
#     intent-targeted validation of whether the change meets its brief;
#     .github/workflows/ci.yml owns broad regression (behavior suite, platform,
#     security, Herdr, tmux, and lifecycle coverage), and duplicating it here
#     would defeat the targeted Test contract.
# `bin/fm-test-run.sh --changed` is the deliberate reconciliation of the two: it
# is fully deterministic with no agent in the loop, derives its set from the
# repository's own changed-file map (one owner, so it cannot rot the way a
# hand-picked subset does), and exits non-zero when any selected script fails.
# Its bound is what the change touches, not a fixed size. A small change selects
# a small set; a repository-wide reconciliation selects every script, and that is
# the correct outcome rather than an exception, because the selection tracks
# intent and there the intent is the whole repository. A fixed lane would always
# be smaller yet would test the same slice no matter what changed, abandoning the
# targeting this pin exists for.
# Two preconditions fail closed by design. A changed path the map cannot resolve
# stops the step with "no changed-test mapping for source path: <path>" rather
# than silently testing nothing, which is a real gate result and not a broken
# gate. Most `bin/` paths are claimed by an explicit family pattern; a `bin/` path
# no family pattern claims resolves through a test-reference lookup rather than a
# per-script table entry, because bin/fm-test-run.sh scans tests/*.test.sh for the
# changed file's basename and selects the families of whichever scripts name it. So
# an unclaimed new bin/ script that ships with the covering test this repository
# already requires maps on its own, and that error means NO test mentions the
# changed file at all - whose remedy is to add or name the covering test, not to
# edit a map.
# `--base origin/main` must resolve wherever the gate runs, or the step stops
# with "changed-file base ref not found", so keep that ref fetched there.
# Do not drop either half: replacing this with an absent commands.test restores
# the agent-driven crash risk, and hardcoding a complete-suite walk or --all
# duplicates CI. Use `--all` locally for deliberate full regression instead.
commands:
  lint: 'bin/fm-lint.sh'
  test: 'bin/fm-test-run.sh --changed --base origin/main'

# Keep test evidence out of this repo; it stays in a temp dir instead.
test:
  evidence:
    store_in_repo: false
