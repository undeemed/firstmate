# Per-repo no-mistakes overrides.

# firstmate is an agent-orchestration repo: its AGENTS.md installs a fleet-captain
# identity. Disable project-level agent settings/instructions for gate agents so a
# no-mistakes review/fix/document/test/lint/pr/rebase/ci agent never adopts that
# identity or drives the fleet. Trusted-only: a pushed branch cannot turn this off,
# so it is honored only from the default-branch copy of this file. Layered above
# the NO_MISTAKES_GATE lifecycle refusal (bin/fm-gate-refuse-lib.sh) and the
# HEAD-continuity guard; see docs/architecture.md "No-mistakes gate authority boundary."
disable_project_settings: true

# Trusted documentation placement policy for the Document step.
# The audience inventory and coding guideline own the detail; keep this as a
# pointer so gate instructions cannot become a second prose policy.
document:
  instructions: |
    Read docs/documentation-audiences.md and its machine-consumed
    docs/documentation-audiences.json inventory before changing documentation.
    Apply the knowledge-placement policy in
    .agents/skills/firstmate-coding-guidelines/SKILL.md.
    For changed prose, verify audience, authoritative owner, current relevance,
    evidence destination, and unique safety facts, then review the complete
    branch diff again after every documentation or lint fix.

# Pin lint to the same owner CI runs instead of leaving it to no-mistakes'
# default handling, which does not invoke the repository's canonical lint gate.
# `bin/fm-lint.sh` owns the complete lint definition and
# `.github/workflows/ci.yml` invokes it directly, with parity asserted by
# `tests/fm-lint.test.sh`.
#
# Pin test to a deterministic, non-agent command, and bound how much of the suite
# the local step runs. Two contracts meet here and both are kept:
#   - WHO runs the step: never an agent. An agent-driven Test step has crashed
#     the daemon, so this repository pins a concrete command instead of leaving
#     Test to default agent-driven handling.
#   - HOW MUCH it runs: a deliberately bounded lane. The previous
#     `bin/fm-test-run.sh --changed --base origin/main` pin is not narrow by
#     nature. Its set is whatever the change maps to, so a repository-wide branch
#     legitimately resolves to the entire suite: measured on this branch,
#     `--list --changed --base origin/main` selects 102 scripts, identical to
#     `--list --all`. A full local walk duplicates CI and a local full-suite run
#     has already been interrupted for memory on this fleet container, so the
#     local step is pinned to the portable-serial lane, which runs its scripts
#     one at a time.
# portable-serial is a bounded SUBSET, 62 of 102 scripts on this branch: it
# excludes the proven-isolated parallel scripts and the real-Herdr-gated lane, so
# it is not complete local coverage and must not be read as such. CI owns
# complete regression through the portable-parallel-1, portable-parallel-2, and
# portable-serial lanes plus the required Herdr lane, with
# `bin/fm-test-run.sh --check-coverage` proving that partition is complete.
# `bin/fm-test-run.sh` remains the one owner of lane composition, so the pinned
# lane cannot rot the way a hand-picked script list would, and the step exits
# non-zero when any selected script fails.
# Do not drop either half: replacing this with an absent commands.test restores
# the agent-driven crash risk, and hardcoding a complete-suite walk or --all puts
# the local step back on the full run CI already owns. Use `--all` by hand for
# deliberate full local regression instead.
commands:
  lint: 'bin/fm-lint.sh'
  test: 'bin/fm-test-run.sh --lane portable-serial'

# Keep test evidence out of this repo; it stays in a temp dir instead.
test:
  evidence:
    store_in_repo: false
